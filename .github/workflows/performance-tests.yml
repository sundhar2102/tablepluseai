name: TablePulse Baseline Performance Load Test

on:
  workflow_dispatch:
    inputs:
      virtual_users:
        description: 'Number of concurrent virtual users'
        required: false
        default: '300'
      duration_seconds:
        description: 'Load test duration in seconds'
        required: false
        default: '60'

jobs:
  performance-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: tablepulse_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm install
        cd server && npm install

    - name: Configure environment variables
      run: |
        cat << 'EOF' > server/.env
        PORT=3001
        NODE_ENV=test
        DB_HOST=127.0.0.1
        DB_PORT=3306
        DB_USER=root
        DB_PASSWORD=password
        DB_NAME=tablepulse_db
        JWT_SECRET=supersecretdevjwtkeyfortablepulseai2026
        JWT_EXPIRY=24h
        CLIENT_URL=http://localhost:5173
        EOF

    - name: Run Database Migrations & Seeds
      run: node server/database/run-migrations.js

    - name: Start Backend Server
      run: |
        node server/server.js &
        sleep 5

    - name: Run Baseline Concurrency Load Test
      run: npm run test:performance

    - name: Upload Performance Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: performance-reports
        path: |
          reports/performance/
        if-no-files-found: warn
