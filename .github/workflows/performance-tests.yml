name: Smart Table AI Performance & Load Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0' # Weekly run on Sundays

jobs:
  load-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: tablepulse_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm install
        npm --prefix server install

    - name: Configure environment variables
      run: |
        cat << 'EOF' > server/.env
        PORT=3001
        NODE_ENV=test
        DB_HOST=127.0.0.1
        DB_PORT=3306
        DB_USER=root
        DB_PASSWORD=password
        DB_NAME=tablepulse_db
        JWT_SECRET=supersecretdevjwtkeyfortablepulseai2026
        JWT_EXPIRY=24h
        CLIENT_URL=http://localhost:5173
        EOF
        cp server/.env .env

    - name: Seed Database
      run: |
        node server/database/run-migrations.js
        node server/database/seed_rich_menus.js

    - name: Start Backend Server
      run: |
        npm --prefix server start &
        npx wait-on -t 20000 http://localhost:3001/api/health

    - name: Run 300 VU Load Test
      run: |
        node tests/performance-tests/run-load-test.js

    - name: Upload Load Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: performance-artifacts
        path: reports/
