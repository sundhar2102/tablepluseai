name: TablePulse Web Selenium Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  web-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: tablepulse_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Set up Google Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    - name: Install dependencies
      run: |
        npm install
        cd server && npm install
        cd ../client && npm install
        cd ../tests/selenium && npm install

    - name: Configure environment variables
      run: |
        cat << 'EOF' > server/.env
        PORT=3001
        NODE_ENV=test
        DB_HOST=127.0.0.1
        DB_PORT=3306
        DB_USER=root
        DB_PASSWORD=password
        DB_NAME=tablepulse_db
        JWT_SECRET=supersecretdevjwtkeyfortablepulseai2026
        JWT_EXPIRY=24h
        CLIENT_URL=http://localhost:5173
        EOF
        cp server/.env .env
        echo "VITE_API_URL=http://localhost:3001" > client/.env

    - name: Run Database Migrations & Seeds
      run: node server/database/run-migrations.js

    - name: Start Backend Server
      run: |
        node server/server.js &
        sleep 5
        curl --retry 5 --retry-delay 2 --retry-connrefused http://localhost:3001/api/health

    - name: Start Frontend Client
      run: |
        cd client && npm run build
        npx vite preview --port 5173 --host 0.0.0.0 &
        sleep 5

    - name: Run Web Selenium E2E Automation Suite
      run: npm run test:web

    - name: Run Web UI/UX Verification Suite
      run: npm run test:uiux

    - name: Upload Selenium Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: web-selenium-reports
        path: |
          reports/selenium/
          reports/uiux/
        if-no-files-found: warn
