name: TablePulse REST API Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: tablepulse_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm install
        npm --prefix server install

    - name: Configure environment variables
      run: |
        cat << 'EOF' > server/.env
        PORT=3001
        NODE_ENV=test
        DB_HOST=127.0.0.1
        DB_PORT=3306
        DB_USER=root
        DB_PASSWORD=password
        DB_NAME=tablepulse_db
        JWT_SECRET=supersecretdevjwtkeyfortablepulseai2026
        JWT_EXPIRY=24h
        CLIENT_URL=http://localhost:5173
        EOF
        cp server/.env .env

    - name: Seed Database
      run: |
        mysql -h 127.0.0.1 -u root -ppassword tablepulse_db < server/database/schema.sql
        mysql -h 127.0.0.1 -u root -ppassword tablepulse_db < server/database/seeds/seed_restaurants.sql
        mysql -h 127.0.0.1 -u root -ppassword tablepulse_db < server/database/seeds/seed_menus.sql
        node server/database/seed_rich_menus.js

    - name: Start Backend Server
      run: |
        npm --prefix server start &
        npx wait-on -t 20000 http://localhost:3001/api/health

    - name: Run Master REST API Tests
      run: |
        node tests/api-tests/run-api-tests.js

    - name: Run Data Integrity & Isolation Audit
      run: |
        node tests/test-production-data-integrity.js

    - name: Run Dietary Intent & AI Recommendation Tests
      run: |
        node tests/test-dietary-intent-e2e.js

    - name: Run Multi-Restaurant Menu Tests
      run: |
        node tests/multi-restaurant-menu-ai-test.js
