name: Smart Table AI Android Build Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 22 (LTS)
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install dependencies
      run: |
        npm install
        npm --prefix client install

    - name: Build Web Application
      run: |
        npm --prefix client run build

    - name: Sync Capacitor to Android
      run: |
        cd client
        npx cap sync android

    - name: Grant Execute Permission to Gradle Wrapper
      run: |
        chmod +x client/android/gradlew

    - name: Build Android Debug APK
      run: |
        cd client/android
        ./gradlew assembleDebug --no-daemon

    - name: Upload Android APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: smart-table-ai-debug-apk
        path: client/android/app/build/outputs/apk/debug/*.apk
